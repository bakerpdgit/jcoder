name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      # `public/teavm/` is committed, so checkout already has the exact bundle
      # that ships. This used to restore a cached `npm run fetch:runtime`
      # download over it — which would now replace a build made from source
      # with the June 2025 one from teavm.org and fail the strict-mode specs,
      # correctly but confusingly. Do not reintroduce that cache.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
